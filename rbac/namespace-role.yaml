# Apply once per namespace this Lambda will start/stop.
# Group name must match var.rbac_group and the EKS access entry.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: env-start-stop
  namespace: __NAMESPACE__
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "patch", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: env-start-stop
  namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: env-start-stop
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: __RBAC_GROUP__
